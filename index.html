<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>أكاديمية خطوة</title>
  <link rel="icon" type="image/png" href="/assets/icon-cyan.png">
  <link rel="preload" href="/fonts/cairo/static/Cairo-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/cairo/static/Cairo-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <script>
  (function(){var t;try{t=localStorage.getItem('khutwa-theme')}catch(e){}
  if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  document.documentElement.dataset.theme=t})();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
